<script>
(function(){
  try{ console.info('DENTED build __BUILD__'); }catch(e){}
  var BS  = 'https://robinhoodchain.blockscout.com/api/v2';
  var DS  = 'https://api.dexscreener.com/latest/dex/tokens/';
  var SR  = 'https://api.dexscreener.com/latest/dex/search?q=';
  var OR  = 'https://api.dexscreener.com/orders/v1/robinhood/';
  var GT  = 'https://api.geckoterminal.com/api/v2/networks/robinhood';
  var RPC = 'https://rpc.mainnet.chain.robinhood.com';
  var SCAN= 'https://robinhoodchain.blockscout.com';

  // function selectors
  var F_OWNER='0x8da5cb5b', F_TRANSFER='0xa9059cbb',
      F_ISLOCKED='0x4a4fbeec', F_LOCKEDSUP='0x732e78e4';

  var OUT='#3D4759',LIT='#C7D0DC',TIN='#8B9BB4',DRK='#5A667E',RUST='#7A4A2E',GHOST='#4A4351';
  var CRM=[244,232,193],CRM_D=[167,155,124],RED=[228,59,68],RED_D=[142,36,41];

  function hash(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function lcg(n){var s=n>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
  function mix(a,b,t){return 'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';}
  function grey(c,t){var g=c[0]*.3+c[1]*.59+c[2]*.11;return [c[0]+(g-c[0])*t,c[1]+(g-c[1])*t,c[2]+(g-c[2])*t];}

  function draw(cv,o){
    var ctx=cv.getContext('2d');ctx.clearRect(0,0,18,30);
    var rnd=lcg(hash(o.id||'x')),dead=!!o.expired;
    var fade=Math.min(1,o.age||0),rust=Math.min(1,o.rust||0);
    var depth=Math.round((o.dent/100)*6),span=Math.max(2,4+Math.round((o.dent/100)*11)),top=18-Math.floor(span/2);
    var cA=grey(CRM,dead?.75:fade*.55),cB=grey(CRM_D,dead?.75:fade*.55);
    var rA=grey(RED,dead?.8:fade*.5),rB=grey(RED_D,dead?.8:fade*.5);
    var tin=dead?GHOST:TIN,lit=dead?'#6E687A':LIT,drk=dead?'#3E3947':DRK;
    var body={};
    function px(x,y,c){ctx.fillStyle=c;ctx.fillRect(x,y,1,1);body[x+','+y]=1;}
    for(var y=0;y<30;y++){
      var l,r;
      if(y<2){l=5;r=12;}else if(y<4){l=4;r=13;}
      else{l=3;r=15;if(y>=top&&y<top+span){var t=(y-top)/(span-1);r=15-Math.round(depth*Math.sin(t*Math.PI));}}
      var inD=(y>=top&&y<top+span&&r<15),sh=inD?3:1;
      for(var x=l;x<=r;x++){
        var dk=x>=r-sh,c;
        if(y<4)c=lit;
        else if(y>=12&&y<=22)c=(y>=16&&y<=18)?mix(rA,rB,dk?1:0):mix(cA,cB,dk?1:0);
        else c=x<=l+1?lit:(dk?drk:tin);
        if(!dead&&rust>0&&y>4&&rnd()<rust*.22)c=RUST;
        px(x,y,c);
      }
      px(l,y,OUT);px(r,y,OUT);
    }
    for(var x=5;x<13;x++)px(x,0,OUT);
    for(var x=3;x<16;x++)px(x,29,OUT);
    for(var x=4;x<14;x++)px(x,3,OUT);
    if(dead)for(var i=0;i<13;i++){
      if(body[(3+i)+','+(10+i)])px(3+i,10+i,'#C24343');
      if(body[(15-i)+','+(10+i)])px(15-i,10+i,'#C24343');
    }
  }

  // ---- pixel candlestick chart ----
  var SUB='₀₁₂₃₄₅₆₇₈₉';
  function subn(n){ var o='',t=String(n); for(var i=0;i<t.length;i++) o+=SUB[+t[i]]; return o; }
  function fmtPx(v){
    if(v==null||!isFinite(v)||v<=0) return '—';
    if(v>=1000) return '$'+Math.round(v).toLocaleString('en-US');
    if(v>=1)    return '$'+v.toFixed(v>=100?2:4);
    if(v>=0.001)return '$'+v.toFixed(6).replace(/0+$/,'').replace(/\.$/,'');
    var e=v.toExponential(3);                       // 8.270e-5
    var m=e.match(/^(\d)\.(\d+)e-(\d+)$/);
    if(!m) return '$'+v.toPrecision(4);
    return '$0.0'+subn(parseInt(m[3],10)-1)+(m[1]+m[2]).slice(0,4);
  }

  function chart(cv,rows,scaleRows,opt){
    opt=opt||{};
    var W=360,H=150;cv.width=W;cv.height=H;
    var ctx=cv.getContext('2d');
    ctx.fillStyle='#06080E';ctx.fillRect(0,0,W,H);
    if(!rows||rows.length<2){
      ctx.fillStyle='#2C3A59';ctx.fillRect(0,Math.round(H/2),W,1);
      return null;
    }
    var ref=scaleRows||rows;
    var n=ref.length, cw=Math.max(2,Math.floor(W/n)), pad=4;
    var hi=-Infinity, lo=Infinity;
    ref.forEach(function(r){ if(r[2]>hi)hi=r[2]; if(r[3]<lo)lo=r[3]; });
    if(opt.entry!=null){ if(opt.entry>hi)hi=opt.entry; if(opt.entry<lo)lo=opt.entry; }
    if(!(hi>lo)){hi=hi*1.01+1e-12;lo=lo*0.99;}
    var padv=(hi-lo)*0.06, trueLo=lo;
    hi+=padv; lo-=padv; if(lo<=0) lo=trueLo*0.9;
    var top=pad, bot=H-pad-14, span=bot-top;
    function y(v){ return Math.round(bot-(v-lo)/(hi-lo)*span); }

    // grid, so it reads like an instrument rather than a sparkline
    ctx.fillStyle='#121A2A';
    for(var g=0;g<=4;g++){ var gy=Math.round(top+span*g/4); ctx.fillRect(0,gy,W,1); }
    for(var gx=0;gx<W;gx+=Math.max(30,Math.round(W/6))) ctx.fillRect(gx,top,1,span);

    var vmax=0;ref.forEach(function(r){ if(r[5]>vmax)vmax=r[5]; });
    rows.forEach(function(r,i){
      var x=i*cw, up=r[4]>=r[1];
      if(vmax>0){
        var vh=Math.max(1,Math.round(r[5]/vmax*11));
        ctx.fillStyle=up?'#25502A':'#55202A';
        ctx.fillRect(x,H-pad-vh,Math.max(1,cw-1),vh);
      }
      var yo=y(r[1]),yc=y(r[4]),yh=y(r[2]),yl=y(r[3]);
      ctx.fillStyle=up?'#5FC96A':'#E4453B';
      ctx.fillRect(x+Math.floor(cw/2),yh,1,Math.max(1,yl-yh));
      var a=Math.min(yo,yc),b=Math.max(yo,yc);
      ctx.fillRect(x,a,Math.max(1,cw-1),Math.max(1,b-a));
    });

    // the high of the window
    ctx.fillStyle='#8A6A21';
    for(var x2=0;x2<W;x2+=3) ctx.fillRect(x2,y(hi-padv),2,1);
    // where it is trading now
    var lastY=y(rows[rows.length-1][4]);
    ctx.fillStyle='#4A5878';
    for(var x3=0;x3<W;x3+=4) ctx.fillRect(x3,lastY,2,1);
    // the entry line, if one is set
    if(opt.entry!=null){
      ctx.fillStyle='#E8B54B';
      for(var x4=0;x4<W;x4+=2) ctx.fillRect(x4,y(opt.entry),1,1);
    }
    return {W:W,H:H,cw:cw,n:rows.length,hi:hi,lo:lo,top:top,bot:bot,
            y:y, val:function(py){ return lo+(bot-py)/span*(hi-lo); }};
  }

  function fmtUsd(n){
    if(n==null||isNaN(n))return '—';
    if(n>=1e9)return '$'+(n/1e9).toFixed(2)+'B';
    if(n>=1e6)return '$'+(n/1e6).toFixed(2)+'M';
    if(n>=1e3)return '$'+(n/1e3).toFixed(1)+'k';
    return '$'+Number(n).toFixed(2);
  }
  function days(ms){ if(!ms)return null; return Math.floor((Date.now()-ms)/86400000); }
  function hours(ms){ if(!ms)return null; return (Date.now()-ms)/3600000; }
  function shortName(n){
    if(!n) return null;
    var t=String(n)
      .replace(/(Launch)?(Deployer|Factory|Launcher|Launchpad|Locker|Creator|Manager|Router|Contract)$/i,'')
      .replace(/Launch$/i,'')
      .replace(/([a-z])([A-Z])/g,'$1 $2')         // PonsLaunch -> Pons Launch
      .replace(/([a-z])([0-9])/g,'$1 $2')         // PonsV2 -> Pons V 2 -> tidied below
      .replace(/([0-9])([A-Za-z])/g,'$1 $2')
      .replace(/\b([A-Za-z]) ([0-9])\b/g,'$1$2') // V 2 -> V2
      .replace(/\s+/g,' ').trim();
    if(!t) t=String(n);
    return t.length>16 ? t.slice(0,15)+'…' : t;
  }

  function shrt(a){ return a? a.slice(0,6)+'…'+a.slice(-4) : '—'; }

  function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
  // nothing may hang for ever: every promise here gets a ceiling
  function timed(p,ms){
    return new Promise(function(res,rej){
      var done=false;
      var t=setTimeout(function(){ if(!done){ done=true; rej(new Error('timeout')); } },ms);
      p.then(function(v){ if(!done){ done=true; clearTimeout(t); res(v); } },
             function(e){ if(!done){ done=true; clearTimeout(t); rej(e); } });
    });
  }
  function fetchJson(u,ms){
    var ctl = (typeof AbortController!=='undefined') ? new AbortController() : null;
    var o={headers:{'accept':'application/json'}};
    if(ctl) o.signal=ctl.signal;
    var p=fetch(u,o).then(function(r){
      if(!r.ok){ var e=new Error('HTTP '+r.status); e.status=r.status; e.url=u; throw e; }
      return r.json();
    });
    return timed(p, ms||9000).catch(function(e){ try{ if(ctl) ctl.abort(); }catch(x){} throw e; });
  }
  function jget(u,tries){
    tries = tries==null?1:tries;
    return fetchJson(u).catch(function(e){
      if(tries>0) return wait(400).then(function(){ return jget(u,tries-1); });
      throw e;
    });
  }
  function call(o){
    return fetch(RPC,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_call',params:[o,'latest']})})
      .then(function(r){return r.json();});
  }
  function p32(a){ return String(a).toLowerCase().replace('0x','').padStart(64,'0'); }
  function hex2n(h){ try{ return BigInt(h); }catch(e){ return 0n; } }


  // ---------------- motion ----------------
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ease = function(t){ return 1-Math.pow(1-t,3); };
  function tween(ms,step,done){
    if(REDUCED){ step(1); if(done)done(); return; }
    var t0=null;
    function frame(ts){
      if(t0===null)t0=ts;
      var k=Math.min(1,(ts-t0)/ms);
      step(ease(k));
      if(k<1) requestAnimationFrame(frame); else if(done) done();
    }
    requestAnimationFrame(frame);
  }
  var revealer = ('IntersectionObserver' in window) ? new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); revealer.unobserve(e.target); } });
  },{rootMargin:'0px 0px -8% 0px',threshold:.05}) : null;
  function watchReveals(root){
    var ns=(root||document).querySelectorAll('.reveal:not(.in)');
    for(var i=0;i<ns.length;i++){
      if(revealer) revealer.observe(ns[i]); else ns[i].classList.add('in');
    }
  }
  function stagger(list){ for(var i=0;i<list.length;i++) list[i].style.setProperty('--i',i); }

  // ---- red flags in verified source ----
  var PATTERNS = [
    {re:/function\s+mint\s*\(/i,           bad:'Can still mint new supply'},
    {re:/blacklist|blocklist|_isBlacklist/i,bad:'Can block wallets from selling'},
    {re:/function\s+set(Fee|Tax|Buy|Sell)/i,bad:'Fees can be changed after launch'},
    {re:/_pause\(|function\s+pause\s*\(/i,  bad:'Transfers can be paused'},
    {re:/maxTx|maxWallet|_maxTransaction/i, bad:'Caps on how much you may move'}
  ];
  var IMPOST = /robinhood|tenev|\bvlad\b|\bofficial\b|\bverified\b|\bnot a (scam|rug)\b|\bsafe\b/i;
  var RELEASE= /withdraw|unlock|release|claim|sweep|rescue|emergency|recover|exit/i;

  function analyse(d){
    var f=[], score=0;
    function sec(t){ f.push(['sec',t]); }

    // ---------- can you get out ----------
    sec('CAN YOU GET BACK OUT');
    if(d.sim==='ok') f.push(['ok','Simulated a transfer from a real holder straight into the pool — it went through. The token is not refusing to move.']);
    else if(d.sim==='blocked'){ f.push(['bad','A simulated transfer from a real holder was REJECTED by the contract — to the pool and to a dead address alike. Money goes in and does not come out. This is what a honeypot looks like.']); score+=10; }
    else if(d.sim==='sellblocked'){ f.push(['bad','A real holder can send these tokens to a normal address, but the same transfer INTO THE POOL is rejected. You would be able to hold it and not to sell it.']); score+=10; }
    else f.push(['na','Transfer simulation — could not be run on this token']);

    if(d.lockPermanent===true) f.push(['ok','Launch liquidity is held by the launchpad locker, and that locker’s published code exposes no withdraw, unlock or release function at all — there is no call that moves the position back out']);
    else if(d.lockPermanent===false){ f.push(['mid','Liquidity is in a locker, but that locker does have a release function ('+d.releaseFn+') — somebody can take it back out']); score+=2; }
    else if(d.locked>0.5) f.push(['ok','Some supply sits in a locker or burn address']);
    else if(d.lockerAddr===null && d.inPools>0.5) f.push(['mid','No launchpad locker holds this token — the liquidity is wherever whoever added it wants it']);

    // ---------- behind the price ----------
    sec('WHAT IS BEHIND THE PRICE');
    var liq=d.liquidity, vol=d.vol24, buys=d.buys, sells=d.sells, ch24=d.change24;
    if(liq==null){ f.push(['na','Liquidity — no pair found on the DEX']); }
    var poolNote = d.pools>1 ? ' across '+d.pools+' pools' : '';
    if(liq<5000){ f.push(['bad','Liquidity '+fmtUsd(liq)+poolNote+' — anything of size moves the price']); score+=2; }
    else if(liq<25000){ f.push(['mid','Liquidity '+fmtUsd(liq)+poolNote+' — thin']); score+=1; }
    else f.push(['ok','Liquidity '+fmtUsd(liq)+poolNote+' (both sides of each pool)']);

    if(d.mc && liq!=null){
      var back = liq/d.mc*100; d.backing=back;
      if(back<2){ f.push(['bad','Market cap '+fmtUsd(d.mc)+' sits on '+fmtUsd(liq)+' of liquidity — '+back.toFixed(1)+'% of that number is actually backed. The rest is arithmetic.']); score+=2; }
      else if(back<6){ f.push(['mid','Only '+back.toFixed(1)+'% of the '+fmtUsd(d.mc)+' market cap is backed by liquidity']); score+=1; }
      else f.push(['ok',back.toFixed(1)+'% of the '+fmtUsd(d.mc)+' market cap is backed by liquidity']);
    }
    if(vol!=null){
      if(vol<200){ f.push(['bad','Volume in 24h is '+fmtUsd(vol)+' — effectively nobody is trading it']); score+=2; }
      else f.push(['ok','Volume in 24h is '+fmtUsd(vol)]);
    }
    if(buys!=null&&sells!=null&&(buys+sells)>20){
      if(sells>buys*1.6){ f.push(['mid',sells+' sells against '+buys+' buys — people are leaving']); score+=1; }
      else f.push(['ok',buys+' buys against '+sells+' sells']);
    }
    if(d.ageHours!=null){
      if(d.ageHours<24){ f.push(['mid','Pair is '+Math.max(1,Math.round(d.ageHours))+'h old — the window where most of this goes wrong']); score+=1; }
      else if(d.ageDays<3){ f.push(['mid','Pair is '+d.ageDays+' days old — still very new']); score+=1; }
      else f.push(['ok','Pair is '+d.ageDays+' days old']);
    }

    // ---------- the pulse ----------
    sec('THE PULSE — IS IT STILL ALIVE');
    if(d.drawdown!=null){
      if(d.drawdown>85){ f.push(['bad','Down '+d.drawdown.toFixed(0)+'% from its high. The dent in the chart is most of the can.']); score+=3; }
      else if(d.drawdown>50){ f.push(['mid','Down '+d.drawdown.toFixed(0)+'% from its high']); score+=2; }
      else if(d.drawdown>20){ f.push(['mid','Down '+d.drawdown.toFixed(0)+'% from its high']); score+=1; }
      else f.push(['ok','Trading within '+d.drawdown.toFixed(0)+'% of its high']);
    }
    if(d.txH24>40 && d.txH1!=null){
      var span=Math.max(1,Math.min(24,d.ageHours||24));
      var rate=d.txH24/span, r=rate>0? d.txH1/rate : null;
      d.pulse=r;
      if(r>=1.5) f.push(['ok','Trading in the last hour is '+r.toFixed(1)+'× the average hour since it launched — attention is still arriving']);
      else if(r>=0.6) f.push(['ok','Trading in the last hour is holding at '+r.toFixed(1)+'× the average hour since it launched']);
      else if(r>=0.2){ f.push(['mid','Trading in the last hour is '+r.toFixed(2)+'× the average hour since it launched — cooling']); score+=1; }
      else { f.push(['bad','Trading in the last hour is '+r.toFixed(2)+'× the average hour since it launched — it has almost stopped']); score+=2; }
    } else f.push(['na','Not enough trades to read a trend']);

    if(ch24!=null&&d.chH6!=null){
      if(ch24>20&&d.chH6<-40){ f.push(['bad','Up '+ch24.toFixed(0)+'% on the day but down '+Math.abs(d.chH6).toFixed(0)+'% in the last 6 hours — the top already happened, you would be buying the way back down']); score+=2; }
      else if(ch24>0&&d.chH6<-15){ f.push(['mid','Green on the day, down '+Math.abs(d.chH6).toFixed(0)+'% in the last 6 hours']); score+=1; }
      else f.push(['ok','6h move '+(d.chH6>0?'+':'')+d.chH6.toFixed(1)+'%']);
    }

    // ---------- the can: contract & control ----------
    sec('THE CAN — WHAT CAN STILL BE DONE TO YOU');
    if(d.verified===false){ f.push(['bad','Contract source is not published — nobody can read what it does']); score+=3; }
    else if(d.verified===true){
      f.push(['ok','Contract source is published']);
      (d.hits||[]).forEach(function(h){ f.push(['bad',h]); score+=2; });
      if(!(d.hits||[]).length) f.push(['ok','No mint, blacklist, fee switch or pause found in the source']);
    } else f.push(['na','Contract source — not checked']);

    if(d.owner==='none') f.push(['ok','No owner function at all — there is nobody with special rights over it']);
    else if(d.owner==='renounced') f.push(['ok','Ownership renounced (owner is the zero address)']);
    else if(d.owner){ f.push(['bad','Still owned by '+shrt(d.owner)+' — whatever the contract lets the owner do, that wallet can do']); score+=2; }

    if(d.proxy){ f.push(['bad','This is an upgradeable proxy ('+d.proxy+') — the code you can read today can be replaced tomorrow']); score+=3; }
    else if(d.verified===true) f.push(['ok','Not a proxy — the code cannot be swapped out under you']);

    if(d.creatorName) f.push(['ok','Deployed by '+d.creatorName+' — a launchpad contract, so the token code is the launchpad’s standard one']);
    else if(d.creator){
      if(d.deployerTokens>=5){ f.push(['bad','Deployed by a plain wallet ('+shrt(d.creator)+') that has already put out '+d.deployerTokens+'+ contracts on this chain — this is somebody’s production line, not somebody’s project']); score+=3; }
      else if(d.deployerTokens>=2){ f.push(['mid','Deployed by a plain wallet ('+shrt(d.creator)+') that has deployed '+d.deployerTokens+' contracts before this one']); score+=2; }
      else { f.push(['mid','Deployed by a plain wallet ('+shrt(d.creator)+'), not a known launchpad — the code is whatever that wallet wrote']); score+=1; }
    }

    // ---------- who is holding ----------
    sec('WHO IS HOLDING IT');
    if(d.top10!=null){
      if(d.top10>60){ f.push(['bad','Top 10 wallets hold '+d.top10.toFixed(1)+'% of supply']); score+=3; }
      else if(d.top10>35){ f.push(['mid','Top 10 wallets hold '+d.top10.toFixed(1)+'% of supply']); score+=1; }
      else f.push(['ok','Top 10 wallets hold '+d.top10.toFixed(1)+'% of supply']);

      if(d.top1!=null){
        if(d.top1>20){ f.push(['bad','One wallet alone holds '+d.top1.toFixed(1)+'% — that single address can end the chart']); score+=2; }
        else if(d.top1>8){ f.push(['mid','Largest single wallet holds '+d.top1.toFixed(1)+'%']); score+=1; }
        else f.push(['ok','Largest single wallet holds '+d.top1.toFixed(1)+'%']);
      }
      if(d.inPools>0.5) f.push(['ok','A further '+d.inPools.toFixed(1)+'% sits in pools and locker contracts — that is liquidity, not a holder, so it is left out of the count above']);
      if(d.botsTop10>0) f.push(['na',d.botsTop10+' of the top 10 '+(d.botsTop10===1?'is a contract':'are contracts')+' rather than a plain wallet — bots, routers and smart accounts all look like this, so open them in the explorer before you read anything into it']);
    } else f.push(['na','Holder split — explorer did not return holders']);

    var win = d.transferWindow ? 'the last '+d.transferWindow : 'the last '+d.transfersSeen+' transfers';
    if(d.dumping>0){
      f.push(['bad',d.dumping+' of the top 10 holders '+(d.dumping===1?'has':'have')+' moved tokens out of '+(d.dumping===1?'their':'their')+' wallet within '+win+' — the people at the top are on the move while you are reading this']);
      score+=3;
    } else if(d.transfersSeen>0){
      if(d.windowMins!=null && d.windowMins<30)
        f.push(['na','The last '+d.transfersSeen+' transfers only cover '+win+' — too short a window to say anything about whether the top holders are moving']);
      else f.push(['ok','None of the top 10 holders moved tokens at all in '+win]);
    }

    if(d.freshChecked>=3){
      if(d.fresh>=3){ f.push(['bad',d.fresh+' of the '+d.freshChecked+' biggest wallets checked have almost no history — brand new addresses holding the top of the supply is what a bundled launch looks like']); score+=2; }
      else if(d.fresh>0){ f.push(['mid',d.fresh+' of the '+d.freshChecked+' biggest wallets checked are newly made addresses']); score+=1; }
      else f.push(['ok','The biggest wallets have real transaction history — not addresses made for this launch']);
    }
    if(d.holders!=null){
      if(d.holders<50){ f.push(['mid','Only '+d.holders+' holders']); score+=1; }
      else f.push(['ok',d.holders+' holders']);
    }

    // ---------- the label ----------
    sec('THE LABEL — WHAT IS ON THE OUTSIDE');
    var chans=[]; if(d.web) chans.push('a website'); (d.socials||[]).forEach(function(s){ chans.push(s); });
    if(chans.length===0){ f.push(['mid','No website and no socials attached to the token — a can with no label at all']); score+=1; }
    else f.push(['ok','Label attached: '+chans.join(', ')+' — the links are under the chart']);

    if(d.paidProfile) f.push(['ok','Somebody paid DexScreener to fill in the profile — money was spent on presentation, which is not the same as substance']);
    if(d.boosts>0){
      if(d.ageHours!=null&&d.ageHours<24){ f.push(['mid',d.boosts+' paid DexScreener boosts on a pair less than a day old — this is being pushed at you, not found by you']); score+=1; }
      else f.push(['ok',d.boosts+' paid DexScreener boosts']);
    }
    if(d.impost){ f.push(['bad','The name or ticker leans on somebody else’s ("'+d.impost+'") — tokens that borrow a real name usually have nothing of their own']); score+=3; }
    if(d.weird){ f.push(['mid','The ticker uses characters outside plain Latin — often used to fake a name that is already taken']); score+=1; }

    if(d.sameSym>1){
      if(d.biggerSame){ f.push(['bad','At least '+d.sameSym+' different tokens on this chain carry the ticker $'+d.symbol+', and this is not the biggest one — the one with '+fmtUsd(d.biggerLiq)+' of liquidity is. Check you are on the can you meant to pick up.']); score+=2; }
      else f.push(['mid','At least '+d.sameSym+' different tokens on this chain carry the ticker $'+d.symbol+'. This is the largest of them, but the copies exist and will be mistaken for it.']);
    } else if(d.sameSym===1) f.push(['ok','No other token on this chain is using the ticker $'+d.symbol]);

    // ---------- grade ----------
    var dent = Math.round(score*4.2 + (d.drawdown!=null?Math.min(25,d.drawdown/4):0));
    if(d.verified===false) dent=Math.max(dent,70);
    if(d.sim==='blocked'||d.sim==='sellblocked') dent=100;
    if(d.proxy && d.owner && d.owner!=='none' && d.owner!=='renounced') dent=Math.max(dent,80);
    dent=Math.max(0,Math.min(100,dent));
    var expired = (vol!=null&&vol<200) && (liq!=null&&liq<5000);
    var g;
    if(d.sim==='blocked'||d.sim==='sellblocked') g=['SEALED SHUT','g-flattened'];
    else if(expired) g=['EXPIRED','g-expired'];
    else if(dent<10) g=['MINT','g-mint'];
    else if(dent<35) g=['SCUFFED','g-scuffed'];
    else if(dent<65) g=['DENTED','g-dented'];
    else if(dent<85) g=['CRUSHED','g-crushed'];
    else g=['FLATTENED','g-flattened'];

    return {flags:f, dent:dent, grade:g, expired:expired, score:score};
  }

  function line(d,score,expired){
    if(d.sim==='blocked'||d.sim==='sellblocked') return 'The contract refused a simulated sale. Whatever the chart says, this can does not open. Do not put money in it.';
    if(expired) return 'Nothing behind it. No liquidity worth the name and nobody trading — this can is past its date.';
    if(score>=14) return 'This can arrived flattened. Most of the things that take money from buyers are present at once.';
    if(score>=9) return 'This can arrived dented. Several of the things that take money from buyers are present at once.';
    if(score>=5) return 'Handled. Not a wreck, but there are dents you should see before you pay.';
    if(score>=2) return 'A few scuffs. Nothing here screams, but read them yourself.';
    return 'Nothing obviously wrong on the shelf. That is not the same as good — it only means these particular checks came back clean.';
  }

  // ---------------- render ----------------
  function render(d,res,note){
    var out=document.getElementById('out');
    out.innerHTML='';
    if(note){var n=document.createElement('span');n.className='note '+note[0];n.textContent=note[1];out.appendChild(n);}
    var box=document.createElement('div');box.className='report';

    var head=document.createElement('div');head.className='rhead';
    var cv=document.createElement('canvas');cv.width=18;cv.height=30;
    cv.setAttribute('role','img');cv.setAttribute('aria-label','Condition '+res.grade[0]);
    var right=document.createElement('div');
    right.innerHTML='<div class="verdict '+res.grade[1]+'">'+res.grade[0]+'</div>'+
      '<div class="meter" role="img" aria-label="Dent '+res.dent+' out of 100"><i></i></div>'+
      '<div class="vsub">'+line(d,res.score,res.expired)+'</div>';
    head.appendChild(cv);head.appendChild(right);box.appendChild(head);

    // ---------------- the chart, as an instrument ----------------
    if(d._pairAddr){
      var haveCandles = !!(d.ohlcv && d.ohlcv.length>1);
      var cw=document.createElement('div');cw.className='chartwrap';

      // supply is taken as fixed: market cap is price times the same number of tokens
      var lastPx=haveCandles? d.ohlcv[d.ohlcv.length-1][4] : null;
      var mcFactor=(d.mc&&lastPx>0)? d.mc/lastPx : null;
      if(!mcFactor) chartMode='price';
      function scale(v){ return chartMode==='mcap'? v*mcFactor : v; }
      function fmtV(v){ return chartMode==='mcap'? fmtUsd(v) : fmtPx(v); }
      function conv(rows){
        if(chartMode!=='mcap') return rows;
        return rows.map(function(r){ return [r[0],r[1]*mcFactor,r[2]*mcFactor,r[3]*mcFactor,r[4]*mcFactor,r[5]]; });
      }

      // ---- head: what it costs right now ----
      var head2=document.createElement('div');head2.className='chead';
      head2.innerHTML=
        '<div class="cnow"><b class="px"></b><span class="chg"></span>'+
        '<span class="cstamp"></span></div>'+
        '<div class="cmode">'+
          '<button type="button" class="mb'+(chartMode==='price'?' on':'')+'" data-mode="price">Price</button>'+
          '<button type="button" class="mb'+(chartMode==='mcap'?' on':'')+'" data-mode="mcap"'+(mcFactor?'':' disabled')+'>Mkt cap</button>'+
        '</div>';
      cw.appendChild(head2);

      var bar=document.createElement('div');bar.className='tfs';
      bar.setAttribute('role','group');bar.setAttribute('aria-label','Candle size');
      cw.appendChild(bar);

      // ---- plot ----
      var plot=document.createElement('div');plot.className='plot';
      var cc=document.createElement('canvas');cc.className='chart';
      cc.setAttribute('role','img');
      plot.appendChild(cc);
      var yax=document.createElement('div');yax.className='yaxis';plot.appendChild(yax);
      var vline=document.createElement('i');vline.className='xh';plot.appendChild(vline);
      var hline=document.createElement('i');hline.className='yh';plot.appendChild(hline);
      var bub=document.createElement('i');bub.className='bub';plot.appendChild(bub);
      var tip=document.createElement('div');tip.className='tip';plot.appendChild(tip);
      var mbox=document.createElement('div');mbox.className='meas';plot.appendChild(mbox);
      var eline=document.createElement('i');eline.className='eline';plot.appendChild(eline);
      cw.appendChild(plot);

      var tools=document.createElement('div');tools.className='ctools';
      tools.innerHTML='<button type="button" class="cbtn" data-act="entry">Set entry</button>'+
        '<button type="button" class="cbtn" data-act="clear">Clear</button>'+
        '<span class="chelp">drag across the chart to measure a move</span>';
      cw.appendChild(tools);

      var cap=document.createElement('div');cap.className='chartcap';
      cw.appendChild(cap);
      box.appendChild(cw);

      // ---- state ----
      var view=null, lay=null, curT=null, armed=false, drag=null;
      var entryBtn=tools.querySelector('[data-act="entry"]');
      var clearBtn=tools.querySelector('[data-act="clear"]');

      function drawAxis(){
        if(!lay) return;
        yax.innerHTML='';
        for(var i=0;i<=4;i++){
          var v=lay.lo+(lay.hi-lay.lo)*(1-i/4);
          var el=document.createElement('span');
          el.style.top=(lay.top+(lay.bot-lay.top)*i/4)/lay.H*100+'%';
          el.textContent=fmtV(v);
          yax.appendChild(el);
        }
      }
      function placeLine(el,val,text,cls){
        if(!lay||val==null){ el.style.display='none'; return; }
        el.style.display='block';
        el.style.top=(lay.y(val)/lay.H*100)+'%';
        el.setAttribute('data-l',text||'');
        if(cls) el.className=cls;
      }
      function paint(rows,t,animate){
        curT=t; view=conv(rows);
        cc.setAttribute('aria-label','Candles for '+(d.symbol||'the token')+', '+t.l+' each, '+
          (chartMode==='mcap'?'market cap':'price'));
        var hi=0; view.forEach(function(r){ if(r[2]>hi) hi=r[2]; });
        var last=view[view.length-1][4];
        var off = hi>0 ? Math.max(0,(1-last/hi)*100) : null;
        cap.textContent = t.l+' candles · '+view.length+' of them · gold dashes are the high of this window'+
          (off!=null? ' · '+off.toFixed(0)+'% below it now':'')+
          (t.k===d.tfAuto? ' · this window is the whole life of the pair':'');
        function render1(sub){
          lay=chart(cc,sub,view,{entry:entry!=null?scale(entry):null});
          drawAxis();
          if(entry!=null){
            var now=view[view.length-1][4], e=scale(entry);
            placeLine(eline,e,'ENTRY '+fmtV(e)+'  '+((now/e-1)*100>=0?'+':'')+((now/e-1)*100).toFixed(1)+'%','eline on');
          } else eline.style.display='none';
        }
        if(animate&&!REDUCED) tween(640,function(k){
          render1(view.slice(0,Math.max(2,Math.round(view.length*k))));
        });
        else render1(view);
        updateNow();
      }
      function updateNow(){
        var pxEl0=head2.querySelector('.px');
        head2.querySelector('.cstamp').textContent=new Date().toLocaleTimeString('en-GB',{hour12:false});
        if(!view||!view.length){
          if(livePx!=null&&pxEl0) pxEl0.textContent=fmtV(livePx);
          return;
        }
        var last=view[view.length-1][4], first=view[0][1];
        var pxEl=head2.querySelector('.px'), chEl=head2.querySelector('.chg');
        var shown = (chartMode==='mcap') ? (livePx!=null&&mcFactor? livePx*mcFactor : last)
                                         : (livePx!=null? livePx : last);
        pxEl.textContent=fmtV(shown);
        var pc=first>0? (shown/first-1)*100 : 0;
        chEl.textContent=(pc>=0?'+':'')+pc.toFixed(1)+'% this window';
        chEl.className='chg '+(pc>=0?'up':'dn');
        head2.querySelector('.cstamp').textContent=new Date().toLocaleTimeString('en-GB',{hour12:false});
      }

      // ---- timeframe buttons ----
      var current=d.tfKey||d.tfAuto;
      TFS.forEach(function(t){
        var b2=document.createElement('button');
        b2.type='button'; b2.className='tfb'+(t.k===current?' on':'');
        b2.textContent=t.l; b2.setAttribute('data-tf',t.k);
        b2.setAttribute('aria-pressed', t.k===current?'true':'false');
        b2.addEventListener('click',function(){
          if(b2.classList.contains('on'))return;
          var btns=bar.querySelectorAll('.tfb');
          for(var i=0;i<btns.length;i++){ btns[i].classList.remove('on'); btns[i].setAttribute('aria-pressed','false'); }
          b2.classList.add('on'); b2.setAttribute('aria-pressed','true');
          chosenTf=t.k; d.tfKey=t.k;
          stopRetry();
          loadTf(t,true);
        });
        bar.appendChild(b2);
      });

      // ---- price / market cap ----
      head2.querySelectorAll('.mb').forEach(function(mb){
        mb.addEventListener('click',function(){
          if(mb.disabled||mb.classList.contains('on'))return;
          head2.querySelectorAll('.mb').forEach(function(x){x.classList.remove('on');});
          mb.classList.add('on');
          chartMode=mb.getAttribute('data-mode');
          var rows=(curT&&fold(curT))||d.ohlcv;
          if(rows&&rows.length>1) paint(rows,curT||startT,false);
        });
      });

      // ---- crosshair, tooltip, measure, entry ----
      function pos(ev){
        var r=plot.getBoundingClientRect();
        var pxx=ev.clientX-r.left, pyy=ev.clientY-r.top;
        var cr=cc.getBoundingClientRect();
        var cx=(ev.clientX-cr.left)*(lay?lay.W/cr.width:1);
        var cy=(ev.clientY-cr.top)*(lay?lay.H/cr.height:1);
        var idx=lay? Math.max(0,Math.min(view.length-1,Math.floor(cx/lay.cw))) : 0;
        return {px:pxx,py:pyy,cx:cx,cy:cy,idx:idx,
                val:lay?lay.val(cy):null, inCanvas:(ev.clientX<=cr.right)};
      }
      function showTip(p){
        var r=view[p.idx]; if(!r) return;
        var up=r[4]>=r[1];
        tip.innerHTML='<b>'+new Date(r[0]*1000).toLocaleString('en-GB',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})+'</b>'+
          '<span>O '+fmtV(r[1])+'</span><span>H '+fmtV(r[2])+'</span>'+
          '<span>L '+fmtV(r[3])+'</span><span class="'+(up?'up':'dn')+'">C '+fmtV(r[4])+'</span>'+
          '<span>Vol '+fmtUsd(r[5])+'</span>';
        tip.style.display='block';
        var w=plot.clientWidth;
        tip.style.left=(p.px>w*0.55? p.px-tip.offsetWidth-14 : p.px+14)+'px';
        tip.style.top=Math.max(4,Math.min(plot.clientHeight-tip.offsetHeight-4,p.py-10))+'px';
      }
      plot.addEventListener('pointermove',function(ev){
        if(!lay||!view||!view.length) return;
        var p=pos(ev);
        vline.style.display=hline.style.display='block';
        vline.style.left=p.px+'px'; hline.style.top=p.py+'px';
        bub.style.display='block'; bub.style.top=p.py+'px'; bub.textContent=fmtV(p.val);
        showTip(p);
        if(drag){
          var a=Math.min(drag.px,p.px), b2=Math.max(drag.px,p.px);
          var c=Math.min(drag.py,p.py), dd=Math.max(drag.py,p.py);
          mbox.style.display='block';
          mbox.style.left=a+'px'; mbox.style.width=(b2-a)+'px';
          mbox.style.top=c+'px'; mbox.style.height=(dd-c)+'px';
          var pc=drag.val>0? (p.val/drag.val-1)*100 : 0;
          var bars=Math.abs(p.idx-drag.idx)+1;
          var mins=bars*(curT?curT.mins:1);
          var dur = mins<90? Math.round(mins)+'m' : mins<2880? Math.round(mins/60)+'h' : Math.round(mins/1440)+'d';
          mbox.className='meas '+(pc>=0?'up':'dn');
          mbox.setAttribute('data-l',(pc>=0?'+':'')+pc.toFixed(2)+'%  ·  '+fmtV(drag.val)+' → '+fmtV(p.val)+'  ·  '+bars+' bars, '+dur);
        }
      });
      plot.addEventListener('pointerleave',function(){
        vline.style.display=hline.style.display=bub.style.display=tip.style.display='none';
      });
      plot.addEventListener('pointerdown',function(ev){
        if(!lay||!view||!view.length) return;
        var p=pos(ev);
        if(armed){
          entry=chartMode==='mcap'&&mcFactor? p.val/mcFactor : p.val;
          armed=false; entryBtn.classList.remove('armed'); entryBtn.textContent='Move entry';
          var rws=(curT&&fold(curT))||d.ohlcv;
          if(rws&&rws.length>1) paint(rws,curT,false);
          return;
        }
        drag={px:p.px,py:p.py,idx:p.idx,val:p.val};
        mbox.style.display='none';
        try{ plot.setPointerCapture(ev.pointerId); }catch(e){}
      });
      plot.addEventListener('pointerup',function(ev){
        if(drag){
          var p=pos(ev);
          if(Math.abs(p.px-drag.px)<6 && Math.abs(p.py-drag.py)<6) mbox.style.display='none';
        }
        drag=null;
      });
      entryBtn.addEventListener('click',function(){
        armed=!armed;
        entryBtn.classList.toggle('armed',armed);
        entryBtn.textContent=armed? 'Click the chart…' : (entry!=null?'Move entry':'Set entry');
      });
      clearBtn.addEventListener('click',function(){
        entry=null; armed=false; entryBtn.classList.remove('armed'); entryBtn.textContent='Set entry';
        mbox.style.display='none';
        var rws2=(curT&&fold(curT))||d.ohlcv;
        if(rws2&&rws2.length>1) paint(rws2,curT,false);
      });
      if(entry!=null) entryBtn.textContent='Move entry';

      var loadSeq=0, retryTimer=null, tickTimer=null;
      d._bases=d._bases||{};
      function stopRetry(){
        if(retryTimer){ clearTimeout(retryTimer); retryTimer=null; }
        if(tickTimer){ clearInterval(tickTimer); tickTimer=null; }
      }
      // fold a timeframe out of whatever base is already in memory
      function fold(t){
        var order=TF_BASE[t.k]||['m1'];
        for(var i=0;i<order.length;i++){
          var rows=d._bases[order[i]];
          if(rows&&rows.length){
            var out=bucket(rows,t.mins).slice(-100);
            if(out.length>1) return out;
          }
        }
        return null;
      }
      function missingBase(t){
        var order=TF_BASE[t.k]||['m1'];
        for(var i=0;i<order.length;i++) if(d._bases[order[i]]) return null;
        return order[0];
      }
      function loadTf(t,animate,attempt){
        attempt=attempt||0;
        var mine=++loadSeq;
        stopRetry();
        curT=t;
        var ready=fold(t);
        if(ready){ paint(ready,t,animate!==false); prefetchRest(); return Promise.resolve(); }

        var bk=missingBase(t);
        cap.textContent = attempt? ('reading candles, attempt '+(attempt+1)+'…') : 'reading candles…';
        cw.classList.add('loading'); reportBusy=true;
        return loadBase(d._pools||d._pairAddr,bk,11000).then(function(rows){
          if(mine!==loadSeq) return;
          cw.classList.remove('loading'); reportBusy=false;
          if(!rows||!rows.length){ empty('No bars for this pool yet.'); return; }
          d._bases[bk]=rows;
          var out=fold(t);
          if(!out){ empty('Not enough history for '+t.l+' — try a smaller candle.'); return; }
          if(!d.ohlcv) d.ohlcv=out;
          if(mcFactor==null && d.mc){                   // the factor needs one real price
            var lp=out[out.length-1][4];
            if(lp>0){ mcFactor=d.mc/lp; var mb=head2.querySelector('.mb[data-mode="mcap"]'); if(mb) mb.disabled=false; }
          }
          paint(out,t,animate!==false);
          prefetchRest();
        }).catch(function(e){
          if(mine!==loadSeq) return;
          cw.classList.remove('loading'); reportBusy=false;
          try{ console.warn('DENTED candles failed',e&&e.url,e&&e.message); }catch(x){}
          if(e&&(e.missing||e.status===404||e.status===400)){
            empty('No bars for this pool at that size.');
            return;
          }
          var busy = !e || !e.status || e.status===429 || e.status===503 || /timeout/i.test((e&&e.message)||'');
          var waits=[2000,4000,8000,13000];
          if(busy && attempt<waits.length){
            var left=Math.round(waits[attempt]/1000);
            function show(){ cap.textContent='source is busy — retrying in '+left+'s'; }
            show();
            tickTimer=setInterval(function(){ left--; if(left>0) show(); },1000);
            retryTimer=setTimeout(function(){
              stopRetry();
              if(mine!==loadSeq) return;
              loadTf(t,false,attempt+1);
            },waits[attempt]);
            return;
          }
          var why;
          if(e&&e.status) why='HTTP '+e.status;
          else if(e&&/timeout/i.test(e.message||'')) why='no answer in time';
          else why='the data source is rate limiting us';
          empty('Could not load candles — '+why+'.');
        });
      }
      // quietly fetch the other two bases so every other button answers instantly
      var prefetched=false;
      function prefetchRest(){
        if(prefetched) return; prefetched=true;
        var want=['m1','m15','h4'].filter(function(k){ return !d._bases[k]; });
        var i=0;
        function next(){
          if(i>=want.length) return;
          var k=want[i++];
          setTimeout(function(){
            loadBase(d._pools||d._pairAddr,k,11000).then(function(rows){
              if(rows&&rows.length) d._bases[k]=rows;
            }).catch(function(){}).then(next);
          }, 900);
        }
        next();
      }
      function empty(msg){
        lay=chart(cc,null,null,{});
        yax.innerHTML='';
        cap.innerHTML='';
        var sp=document.createElement('span'); sp.textContent=msg+' ';
        var rb=document.createElement('button'); rb.type='button'; rb.className='cbtn';
        rb.textContent='Retry';
        rb.addEventListener('click',function(){
          gtHold=0;                                   // asking again by hand clears the backoff
          stopRetry();
          loadTf(curT||tfByKey(current)||tf(d.ageHours));
        });
        cap.appendChild(sp); cap.appendChild(rb);
      }

      var startT = tfByKey(current)||tf(d.ageHours);
      if(haveCandles) paint(d.ohlcv, startT, true);
      else loadTf(startT,true);                        // the report loaded without candles: fetch them here

      // ---- the price keeps ticking without reloading the whole report ----
      if(pxTimer) clearInterval(pxTimer);
      function pollPx(){
        if(document.hidden) return;
        jget(DS+d.addr).then(function(j){
          var ps=((j&&j.pairs)||[]).filter(function(x){return x.chainId==='robinhood';});
          if(!ps.length) return;
          ps.sort(function(x,y){ return ((y.liquidity&&y.liquidity.usd)||0)-((x.liquidity&&x.liquidity.usd)||0); });
          var pv=parseFloat(ps[0].priceUsd);
          if(isFinite(pv)&&pv>0){ livePx=pv; updateNow(); }
        }).catch(function(){});
      }
      if(/^0x[a-fA-F0-9]{40}$/.test(d.addr||'')){ pollPx(); pxTimer=setInterval(pollPx,15000); }
    }

    // links
    var L=d.links||{};
    var order=[['site',L.web,'SITE'],['x',L.x,'X / TWITTER'],['tg',L.tg,'TELEGRAM'],['dc',L.dc,'DISCORD'],
               ['ds',L.ds,'DEXSCREENER'],['gt',L.gt,'GECKOTERMINAL'],['sc',L.scan,'EXPLORER']];
    var lr=document.createElement('div');lr.className='links';
    var any=false;
    order.forEach(function(o){
      if(!o[1])return; any=true;
      var a=document.createElement('a');a.href=o[1];a.target='_blank';a.rel='noopener noreferrer nofollow';
      a.className='lnk '+(o[0]==='site'||o[0]==='x'||o[0]==='tg'||o[0]==='dc'?'own':'ext');
      a.textContent=o[2];lr.appendChild(a);
    });
    if(any) box.appendChild(lr);

    var st=document.createElement('div');st.className='stats';
    st.innerHTML=
      '<div><span>Token</span><b>'+(d.symbol?('$'+d.symbol):'—')+'</b></div>'+
      '<div><span>Liquidity</span><b>'+fmtUsd(d.liquidity)+'</b></div>'+
      '<div><span>Market cap</span><b>'+fmtUsd(d.mc)+'</b></div>'+
      '<div><span>Backed</span><b>'+(d.backing!=null?d.backing.toFixed(1)+'%':'—')+'</b></div>'+
      '<div><span>Volume 24h</span><b>'+fmtUsd(d.vol24)+'</b></div>'+
      '<div><span>From high</span><b>'+(d.drawdown!=null?'-'+d.drawdown.toFixed(0)+'%':'—')+'</b></div>'+

          d.transferWindow = mins<90 ? Math.max(1,Math.round(mins))+' minutes' :
                             mins<2880 ? Math.round(mins/60)+' hours' : Math.round(mins/1440)+' days';
        }
      }catch(e){}
      var seen={};
      its.forEach(function(t){
        var fr=String((t.from&&t.from.hash)||'').toLowerCase();
        if(d._top.indexOf(fr)>-1 && !seen[fr]){ seen[fr]=1; d.dumping++; }
      });
      d.windowMins=d._mins;
    }).catch(function(){})
    // fresh-wallet check on the biggest real holders
    .then(function(){
      var list=d._eoas||[]; if(!list.length) return;
      var i=0;
      function step(){
        if(i>=list.length) return;
        var a=list[i++];
        return wait(160).then(function(){ return jget(BS+'/addresses/'+a+'/counters'); })
          .then(function(c){
            d.freshChecked++;
            var n=parseInt((c&&c.transactions_count)||'0',10);
            if(n<5) d.fresh++;
          }).catch(function(){}).then(step);
      }
      return step();
    }).catch(function(){})
    // ---- can a real holder still move it into the pool? ----
    .then(function(){
      if(!d._sell || !d._sinks.length) return;
      var amt=(d._sell.v/1000n); if(amt<=0n) amt=1n;
      var hexAmt=amt.toString(16).padStart(64,'0');
      var DEADA='0x000000000000000000000000000000000000dead';
      function verdict(j){
        if(j&&j.error){
          // 0xe450d38c = ERC20InsufficientBalance — our arithmetic, not their contract
          if(String(j.error.data||'').indexOf('e450d38c')===2) return 'skip';
          return 'revert';
        }
        if(j&&j.result) return /^0x0*0$/.test(j.result) ? 'revert' : 'pass';
        return 'skip';
      }
      return call({from:d._sell.h,to:addr,data:F_TRANSFER+p32(d._sinks[0])+hexAmt}).then(function(j1){
        var v1=verdict(j1);
        if(v1==='pass'){ d.sim='ok'; return; }
        if(v1==='skip'){ d.sim=null; return; }
        // it refused the pool. does it refuse everything, or only the pool?
        return wait(120).then(function(){
          return call({from:d._sell.h,to:addr,data:F_TRANSFER+p32(DEADA)+hexAmt});
        }).then(function(j2){
          var v2=verdict(j2);
          if(v2==='pass') d.sim='sellblocked';
          else if(v2==='revert') d.sim='blocked';
          else d.sim=null;
        });
      }).catch(function(){});
    }).catch(function(){})
    // ---- is the launch liquidity actually locked, and can it come back out? ----
    .then(function(){
      if(!d.lockerAddr) return;
      return call({to:d.lockerAddr,data:F_ISLOCKED+p32(addr)}).then(function(j){
        var locked = j&&j.result && hex2n(j.result)===1n;
        if(!locked) return;
        return wait(120).then(function(){ return jget(BS+'/smart-contracts/'+d.lockerAddr); })
          .then(function(sc){
            var fns=((sc&&sc.abi)||[]).filter(function(x){return x.type==='function'&&x.stateMutability!=='view'&&x.stateMutability!=='pure';});
            var rel=fns.filter(function(x){ return RELEASE.test(x.name||''); });
            if(rel.length){ d.lockPermanent=false; d.releaseFn=rel[0].name+'()'; }
            else d.lockPermanent=true;
          }).catch(function(){});
      }).catch(function(){});
    }).catch(function(){});

    // ---- owner() straight off the chain ----
    var own = call({to:addr,data:F_OWNER}).then(function(j){
      if(j&&j.error){ d.owner='none'; return; }
      var r=j&&j.result;
      if(!r||r==='0x'||r.length<66){ d.owner='none'; return; }
      var a='0x'+r.slice(-40);
      d.owner = /^0x0{40}$/i.test(a) ? 'renounced' : a;
    }).catch(function(){});

    return Promise.all([dex,scan,own]).then(function(){
      if(d._supply){
        try{
          var sup=BigInt(d._supply);
          if(sup>0n){
            if(d._topSum!=null) d.top10=Math.min(100,Number(BigInt(d._topSum)*10000n/sup)/100);
            if(d._top1!=null)   d.top1 =Math.min(100,Number(BigInt(d._top1)*10000n/sup)/100);
            if(d._infraSum!=null) d.inPools=Number(BigInt(d._infraSum)*10000n/sup)/100;
            if(d._lockSum!=null)  d.locked =Number(BigInt(d._lockSum)*10000n/sup)/100;
          }
        }catch(e){}
      }
      return d;
    });
  }

  // ---------------- wiring ----------------
  var inp=document.getElementById('addr'), btn=document.getElementById('go');
  var out=document.getElementById('out');
  var live=false, timer=null, liveBtn=null, watching=null, chosenTf=null, reportBusy=false;
  var chartMode='price', entry=null, livePx=null, pxTimer=null;

  function setLive(on,addr){
    live=on;
    if(timer){ clearInterval(timer); timer=null; }
    if(on && addr){ timer=setInterval(function(){ run(addr,true); }, 120000); }
    if(liveBtn){ liveBtn.classList.toggle('on',on); liveBtn.textContent=on?'Watching · every 2 min':'Watch this can'; }
  }

  function extract(raw){
    var v=(raw||'').trim();
    var m=v.match(/0x[a-fA-F0-9]{64}/);       // uniswap v4 pool id
    if(m) return {kind:'pair', id:m[0]};
    m=v.match(/0x[a-fA-F0-9]{40}/);           // plain token address
    if(m) return {kind:'token', id:m[0]};
    return null;
  }
  function pairToToken(pid){
    return jget('https://api.dexscreener.com/latest/dex/pairs/robinhood/'+pid).then(function(j){
      var p=j&&(j.pair||(j.pairs&&j.pairs[0]));
      if(p&&p.baseToken&&p.baseToken.address) return p.baseToken.address;
      throw new Error('pair not resolved');
    });
  }

  function run(force,quiet){
    var got = typeof force==='string' ? {kind:'token',id:force} : extract(inp.value);
    if(!got){
      out.innerHTML='<span class="note err">Paste a token address, a pair address, or a DexScreener link</span>';
      return;
    }
    btn.disabled=true; btn.textContent='Reading…'; reportBusy=true;
    if(!quiet) out.innerHTML='<span class="note">Reading the chain…</span>'+
      '<div class="scanbar"><i></i></div>';

    if(!quiet && watching!==got.id){ chosenTf=null; entry=null; livePx=null; }  // a different token starts clean
    var p = got.kind==='pair' ? pairToToken(got.id) : Promise.resolve(got.id);

    return p.then(function(addr){ return collect(addr); })
     .then(function(d){
       if(d.liquidity==null && d.holders==null && d.verified==null) throw new Error('no data');
       render(d,analyse(d),null);
       try{ history.replaceState(null,'','?t='+d.addr); }catch(e){}
       if(!live || watching!==d.addr){ watching=d.addr; setLive(true,d.addr); }
     })
     .catch(function(){
       render(DEMO,analyse(DEMO),['demo','Could not read the chain from here — this page needs to run on a normal web host. Showing an example report.']);
     })
     .then(function(){ btn.disabled=false; btn.textContent='Check the can'; reportBusy=false; });
  }

  btn.addEventListener('click', function(){ run(); });
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); run(); } });


  // ---------------- the shelf: what just arrived on this chain ----------------
  // two speeds. the feed polls one page every 5s so arrivals land as they happen;
  // the counters and the day list cost more, so they go once a minute.
  var FAST=20000, SLOW=180000, DAYRATE=300000, AGE=2000;
  var fastTimer=null, slowTimer=null, ageTimer=null, backoff=0;
  var seen={}, order=[], firstFeed=true;

  function num(v){ var n=parseFloat(v); return isNaN(n)?null:n; }

  function quickGrade(o){
    // a cheap read from what the pool listing already gives us — the click runs the real one
    var sc=0;
    if(o.liq<1000) sc+=3; else if(o.liq<5000) sc+=1;
    if(o.vol<200) sc+=3; else if(o.vol<2000) sc+=1;
    if(o.ch1<-30) sc+=2; else if(o.ch1<-10) sc+=1;
    var mins=o.t? (Date.now()-o.t)/60000 : null;   // nothing this young has earned a clean bill
    if(mins!=null){ if(mins<15) sc+=2; else if(mins<60) sc+=1; }
    var dead=(o.vol<200 && o.liq<1000);
    var dent=Math.min(100,sc*11);
    var g = dead?'EXPIRED': dent<15?'MINT': dent<35?'SCUFFED': dent<65?'DENTED': dent<85?'CRUSHED':'FLATTENED';
    var cls= dead?'g-expired': dent<15?'g-mint': dent<35?'g-scuffed': dent<65?'g-dented':'g-crushed';
    return {dent:dent,dead:dead,label:g,cls:cls,score:sc};
  }
  function ago(ms){
    if(!ms) return '—';
    var sec=(Date.now()-ms)/1000;
    if(sec<60) return Math.max(1,Math.round(sec))+'s old';
    var m=sec/60;
    if(m<60) return Math.round(m)+'m old';
    if(m<48*60) return Math.round(m/60)+'h old';
    return Math.round(m/1440)+'d old';
  }
  function poolRows(data){
    var out=[];
    (data||[]).forEach(function(x){
      var a=x.attributes||{};
      var rel=(x.relationships&&x.relationships.base_token&&x.relationships.base_token.data&&x.relationships.base_token.data.id)||'';
      var addr=(String(rel).split('_')[1]||'');
      if(!/^0x[a-fA-F0-9]{40}$/.test(addr)) return;
      var nm=String(a.name||'').split('/')[0].trim();
      out.push({
        addr:addr, sym:nm||'?',
        pool:String(x.id||'').split('_')[1]||'',
        t:Date.parse(a.pool_created_at||'')||0,
        liq:num(a.reserve_in_usd)||0,
        vol:num(a.volume_usd&&a.volume_usd.h24)||0,
        mc:num(a.market_cap_usd)||num(a.fdv_usd)||null,
        ch24:num(a.price_change_percentage&&a.price_change_percentage.h24)||0,
        ch1:num(a.price_change_percentage&&a.price_change_percentage.h1)||0
      });
    });
    return out;
  }

  function makeCan(r,fresh){
    var q=quickGrade(r);
    var b=document.createElement('button');
    b.type='button'; b.className='can'+(q.dead?' dead':'')+(fresh?' fresh':'');
    b.setAttribute('data-addr',r.addr);
    b.setAttribute('data-t',r.t||0);
    b.setAttribute('aria-label','Check '+r.sym+', quick read '+q.label);
    var cv=document.createElement('canvas'); cv.width=18; cv.height=30; b.appendChild(cv);
    if(fresh){ var nb=document.createElement('em'); nb.className='newb'; nb.textContent='NEW'; b.appendChild(nb); }
    var tk=document.createElement('div'); tk.className='tk'; tk.textContent='$'+r.sym; b.appendChild(tk);
    var mt=document.createElement('div'); mt.className='mt';
    mt.textContent=ago(r.t)+' · '+fmtUsd(r.liq); b.appendChild(mt);
    var gr=document.createElement('div'); gr.className='gr '+q.cls; gr.textContent=q.label; b.appendChild(gr);
    b.addEventListener('click', function(){
      inp.value=r.addr; run(r.addr);
      try{ document.getElementById('out').scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){}
    });
    draw(cv,{id:r.addr,dent:q.dent,age:Math.min(1,q.score/6),
             rust:q.dead?.5:Math.min(.4,q.score/12),expired:q.dead});
    if(fresh) setTimeout(function(){ b.classList.remove('fresh'); var n=b.querySelector('.newb'); if(n) n.remove(); }, 12000);
    return b;
  }

  // fast lane — one page, every five seconds, and only the arrivals are touched
  // background reads yield to the chart, but they are postponed, never dropped
  var pending={};
  function whenFree(name,fn,tries){
    tries=tries==null?20:tries;
    if(document.hidden) return;
    if(reportBusy||gtBusyNow()||gtHold>Date.now()){
      if(pending[name]||tries<=0) return;
      pending[name]=setTimeout(function(){ pending[name]=null; whenFree(name,fn,tries-1); },1500);
      return;
    }
    fn();
  }

  function feed(){
    if(document.hidden) return;
    var grid=document.getElementById('shelf'); if(!grid) return;
    return jget(GT+'/new_pools?page=1').then(function(j){
      backoff=0;
      var rows=poolRows(j&&j.data).sort(function(a,b){ return b.t-a.t; });
      var added=0;
      for(var i=rows.length-1;i>=0;i--){          // oldest first, so the newest ends up on top
        var r=rows[i];
        if(seen[r.addr]) continue;
        seen[r.addr]=r;
        order.unshift(r.addr);
        grid.insertBefore(makeCan(r,!firstFeed), grid.firstChild);
        added++;
      }
      while(grid.children.length>20) grid.removeChild(grid.lastChild);
      while(order.length>240){ delete seen[order.pop()]; }
      var wasFirst=firstFeed;
      if(firstFeed){ stagger(grid.querySelectorAll('.can')); firstFeed=false; }
      var f=document.getElementById('feedstamp');
      if(f) f.textContent = wasFirst ? 'watching for arrivals · re-reads every 20s'
        : (added? (added+' new '+(added===1?'can':'cans')+' just now') : 'no new cans since the last read');
    }).catch(function(){
      backoff=Math.min(4,backoff+1);              // the API pushed back; ease off for a moment
    });
  }
  function tickAges(){
    var ns=document.querySelectorAll('#shelf .can');
    for(var i=0;i<ns.length;i++){
      var t=parseInt(ns[i].getAttribute('data-t'),10);
      var r=seen[ns[i].getAttribute('data-addr')];
      var mt=ns[i].querySelector('.mt');
      if(t&&r&&mt) mt.textContent=ago(t)+' · '+fmtUsd(r.liq);
    }
  }

  // slow lane — the counters, from a wider sample
  function counters(){
    if(document.hidden) return;
    var line=document.getElementById('shelfline'), tick=document.getElementById('tick');
    var pages=[1,2,3], all=[], i=0;
    function step(){
      if(i>=pages.length) return;
      var pg=pages[i++];
      return gtFetch(GT+'/new_pools?page='+pg,{drop:true,tries:0}).then(function(j){
        all=all.concat(poolRows(j&&j.data));
      }).catch(function(){}).then(function(){ return wait(260); }).then(step);
    }
    return step().then(function(){
      if(!all.length){ if(line) line.textContent='Could not reach the chain listing from here.'; return; }
      var ts=all.map(function(r){return r.t;}).filter(Boolean).sort(function(a,b){return a-b;});
      var spanMin=ts.length>1 ? Math.max(1,Math.round((ts[ts.length-1]-ts[0])/60000)) : null;
      var dead=all.filter(function(r){ return r.vol<200; }).length;
      var thin=all.filter(function(r){ return r.liq<5000; }).length;
      var win = spanMin==null?'':(spanMin<90? spanMin+' minute'+(spanMin===1?'':'s') : Math.round(spanMin/60)+' hours');
      if(line) line.textContent =
        all.length+' pairs opened on Robinhood Chain in the last '+win+'. '+
        dead+' of them have already gone a day without $200 of trade, and '+thin+' never had $5,000 behind them. '+
        'This is the shelf you are picking off.';
      if(tick) tick.innerHTML =
        '<span class="livedot"></span><b>'+all.length+' cans</b> went on the shelf in the last '+win+
        ' &middot; <i>'+dead+'</i> are already untouched &middot; live, the feed re-reads every 20s';
      var mq=document.getElementById('marq');
      if(mq){
        var bits=all.slice(0,14).map(function(r){
          var q=quickGrade(r);
          return '<span>$'+String(r.sym).replace(/[<>&]/g,'')+' <b>'+q.label+'</b></span>';
        }).join('');
        var lead='<span><i>'+all.length+' new pairs</i> in the last '+win+' &middot; '+dead+' already untouched</span>';
        mq.innerHTML=(lead+bits+lead+bits);
      }
    });
  }

  // ---------------- the day list: biggest of what launched today ----------------
  function bigToday(){
    if(document.hidden) return;
    var body=document.getElementById('topbody'), cap=document.getElementById('topcap');
    if(!body) return;
    // the sorted-pools listing first; if this chain does not serve it, fall back to trending
    return gtFetch(GT+'/pools?sort=h24_volume_usd_desc&page=1',{drop:true,tries:0})
      .catch(function(){ return gtFetch(GT+'/trending_pools?page=1',{drop:true,tries:0}); })
      .then(function(j){
        var rows=poolRows(j&&j.data);
        if(!rows.length) throw new Error('empty');
        var DAY=86400000, FLOOR=10000;
        var today=rows.filter(function(r){ return r.t && (Date.now()-r.t)<DAY && r.liq>=FLOOR; });
        var label;
        if(today.length>=3){
          label='Opened in the last 24 hours, at least '+fmtUsd(FLOOR)+' of liquidity behind them, biggest first by market cap.';
        } else {
          today=rows.filter(function(r){ return r.liq>=FLOOR; });
          label='Not enough of today’s launches cleared '+fmtUsd(FLOOR)+' of liquidity, so this is the biggest on the chain right now rather than the biggest today.';
        }
        today.sort(function(a,b){ return (b.mc||b.liq)-(a.mc||a.liq); });
        today=today.slice(0,10);
        if(cap) cap.textContent=label+' This is not a buy list — it is the large end of the same shelf, and size is not condition.';
        body.innerHTML='';
        today.forEach(function(r,idx){
          var q=quickGrade(r);
          var row=document.createElement('button');
          row.type='button'; row.className='trow'; row.style.setProperty('--i',idx);
          row.setAttribute('aria-label','Check '+r.sym);
          row.innerHTML=
            '<span class="rk">'+String(idx+1).padStart(2,'0')+'</span>'+
            '<span class="sy">$'+String(r.sym).replace(/[<>&]/g,'')+'</span>'+
            '<span class="cl">'+(r.mc!=null?fmtUsd(r.mc):'—')+'</span>'+
            '<span class="cl">'+fmtUsd(r.liq)+'</span>'+
            '<span class="cl">'+fmtUsd(r.vol)+'</span>'+
            '<span class="cl '+(r.ch24>0?'up':r.ch24<0?'dn':'')+'">'+(r.ch24>0?'+':'')+r.ch24.toFixed(0)+'%</span>'+
            '<span class="cl">'+ago(r.t)+'</span>'+
            '<span class="gr '+(q.score<=1?'check':q.cls)+'">'+(q.score<=1?'CHECK IT \u2192':q.label)+'</span>';
          row.addEventListener('click',function(){
            inp.value=r.addr; run(r.addr);
            try{ document.getElementById('out').scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){}
          });
          body.appendChild(row);
        });
      }).catch(function(){
        if(cap) cap.textContent='Could not read the chain listing from here.';
      });
  }

  var dayTimer=null;
  function startPolling(){
    stopPolling();
    // the ages tick locally every two seconds, so the shelf still reads as live while
    // the network side stays light. one page of new pools covers about a minute of
    // launches on this chain, so a twenty second read misses nothing.
    fastTimer=setInterval(function(){ if(backoff>0){ backoff--; return; } whenFree('feed',feed); }, FAST);
    ageTimer =setInterval(tickAges, AGE);
    slowTimer=setInterval(function(){ whenFree('counters',counters); }, SLOW);
    dayTimer =setInterval(function(){ whenFree('day',bigToday); }, DAYRATE);
  }
  function stopPolling(){
    [fastTimer,slowTimer,ageTimer,dayTimer].forEach(function(t){ if(t) clearInterval(t); });
    fastTimer=slowTimer=ageTimer=dayTimer=null;
  }
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) stopPolling();
    else { whenFree('feed',feed); whenFree('counters',counters); whenFree('day',bigToday); startPolling(); }
  });


  // the bar follows you down the page
  (function scrollspy(){
    var tabs=document.querySelectorAll('.nav a.tab[data-sec]');
    if(!tabs.length) return;
    var items=[];
    for(var i=0;i<tabs.length;i++){
      var el=document.getElementById(tabs[i].getAttribute('data-sec'));
      if(el) items.push({tab:tabs[i],el:el});
    }
    if(!items.length) return;
    var queued=false;
    function pick(){
      queued=false;
      var mark=window.pageYOffset+window.innerHeight*0.3;
      var best=items[0];
      items.forEach(function(it){ if(it.el.offsetTop<=mark) best=it; });
      // the very bottom always belongs to the last section
      if(window.innerHeight+window.pageYOffset>=document.body.scrollHeight-4) best=items[items.length-1];
      items.forEach(function(it){ it.tab.classList.toggle('on', it===best); });
    }
    function onScroll(){ if(!queued){ queued=true; requestAnimationFrame(pick); } }
    window.addEventListener('scroll',onScroll,{passive:true});
    window.addEventListener('resize',onScroll);
    pick();
  })();

  // deep link: /?t=0x...
  var q=(location.search.match(/[?&]t=(0x[a-fA-F0-9]{40})/)||[])[1];
  if(q){ inp.value=q; run(q); }
  else render(DEMO,analyse(DEMO),['demo','Example report — paste a contract above for a real one']);

  watchReveals(document);
  whenFree('feed',feed); whenFree('counters',counters); whenFree('day',bigToday);
  startPolling();
})();
</script>
