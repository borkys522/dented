<title>Dented</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap">

<style>
  :root{
    --bg:#06080E; --bg2:#0A0E18; --panel:#0F1523; --panel2:#151C2D;
    --line:#212C45; --line2:#2C3A59;
    --cream:#F2E7C9; --gold:#E8B54B; --gold2:#8A6A21;
    --red:#E4453B; --grey:#7F8FA9; --grey2:#5A6880;
    --green:#5FC96A; --yellow:#FEE761; --dead:#6B5563;
    --title:'Press Start 2P','Courier New',monospace;
    --ui:'Silkscreen','Courier New',monospace;
    --body:'VT323','Courier New',monospace;
    --gutter:clamp(1rem,4vw,3rem);
    --ease:cubic-bezier(.22,.61,.36,1);
    --notch:10px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}

  body{
    background:var(--bg);color:var(--cream);font-family:var(--body);
    font-size:clamp(1.15rem,1.08rem + .3vw,1.38rem);line-height:1.45;overflow-x:hidden;
    margin:0;position:relative;
  }
  /* layered ground: two soft lights, a dither wash, scanlines, vignette */
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:
      radial-gradient(120vw 80vh at 12% -10%, rgba(232,181,75,.10), transparent 62%),
      radial-gradient(90vw 70vh at 92% 8%, rgba(228,69,59,.09), transparent 60%),
      radial-gradient(120vw 90vh at 50% 115%, rgba(95,201,106,.05), transparent 60%),
      linear-gradient(180deg,var(--bg2) 0%,var(--bg) 55%,#04060B 100%);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px),
      radial-gradient(130vw 110vh at 50% 45%, transparent 52%, rgba(0,0,0,.55) 100%);
  }

  canvas,img{image-rendering:pixelated}
  .wrap{max-width:1060px;margin-inline:auto;padding-inline:var(--gutter);position:relative}

  /* ---------- pixel frame: notched corners + inner hairline ---------- */
  .px{
    position:relative;background:var(--panel);
    border:1px solid var(--line2);
    clip-path:polygon(var(--notch) 0,calc(100% - var(--notch)) 0,100% var(--notch),
      100% calc(100% - var(--notch)),calc(100% - var(--notch)) 100%,var(--notch) 100%,
      0 calc(100% - var(--notch)),0 var(--notch));
  }
  .px::before{
    content:"";position:absolute;inset:3px;pointer-events:none;
    border:1px solid rgba(242,231,201,.055);
    clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),
      calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);
  }

  /* ---------- nav ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(180deg,rgba(9,12,21,.94),rgba(6,8,14,.9));
    backdrop-filter:blur(18px) saturate(130%);
    -webkit-backdrop-filter:blur(18px) saturate(130%);
    box-shadow:0 22px 40px -30px rgba(0,0,0,.98);
  }
  .topbar::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(232,181,75,.55) 22%,rgba(228,69,59,.45) 55%,transparent);
  }
  .nav{
    display:flex;align-items:center;gap:1rem;padding-block:.75rem;position:relative;
  }
  .nav .brand{
    font-family:var(--title);font-size:.8rem;color:var(--cream);text-decoration:none;
    letter-spacing:.02em;display:inline-flex;align-items:center;gap:.6rem;flex:none;
    transition:color .25s var(--ease);
  }
  .nav .brand .sq{width:.6rem;height:.6rem;background:var(--red);flex:none;
    animation:sqpulse 3.2s var(--ease) infinite}
  @keyframes sqpulse{0%,70%{box-shadow:0 0 0 0 rgba(228,69,59,.45)}100%{box-shadow:0 0 0 9px rgba(228,69,59,0)}}
  .nav .brand:hover{color:var(--gold)}

  .tabs{
    display:flex;align-items:center;gap:.15rem;margin-left:auto;
    overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
    mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 12px),transparent);
  }
  .tabs::-webkit-scrollbar{display:none}
  .nav a.tab{
    position:relative;font-family:var(--ui);font-size:.66rem;letter-spacing:.15em;text-transform:uppercase;
    text-decoration:none;color:var(--grey);padding:.62rem .85rem;white-space:nowrap;flex:none;
    transition:color .25s var(--ease);
  }
  .nav a.tab::before{
    content:"";position:absolute;inset:.22rem .3rem;background:rgba(232,181,75,.08);
    opacity:0;transform:scaleY(.6);transition:opacity .25s var(--ease),transform .25s var(--ease);
  }
  .nav a.tab::after{
    content:"";position:absolute;left:.85rem;right:.85rem;bottom:.3rem;height:2px;
    background:linear-gradient(90deg,var(--gold),rgba(232,181,75,.35));
    transform:scaleX(0);transform-origin:left;transition:transform .34s var(--ease);
  }
  .nav a.tab:hover{color:var(--cream)}
  .nav a.tab:hover::after{transform:scaleX(1)}
  .nav a.tab:hover::before{opacity:1;transform:none}
  .nav a.tab.on{color:var(--gold)}
  .nav a.tab.on::after{transform:scaleX(1)}
  .nav a.tab.on::before{opacity:1;transform:none}
  .nav a.tab .sm{display:none}

  /* the sticky bar must not sit on top of the heading an anchor lands on */
  section[id],#out{scroll-margin-top:6.4rem}

  /* ---------- marquee ---------- */
  .marq{
    overflow:hidden;border-top:1px solid var(--line);background:rgba(4,6,11,.75);
    font-family:var(--ui);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;
    padding-block:.5rem;position:relative;
  }
  .marqwrap{overflow:hidden;
    mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
  .marq .row{display:inline-flex;white-space:nowrap;will-change:transform;animation:slide 38s linear infinite}
  .marq span{padding-inline:1.1rem;color:var(--grey)}
  .marq b{color:var(--gold);font-weight:700}
  .marq i{font-style:normal;color:var(--red)}
  .marq:hover .row{animation-play-state:paused}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* ---------- sections ---------- */
  section{padding-block:clamp(2.4rem,6vw,4.4rem);border-top:1px solid var(--line);position:relative}
  section.top{border-top:0;padding-block:clamp(2rem,5vw,3.4rem)}
  section::before{
    content:"";position:absolute;top:-1px;left:0;width:clamp(60px,14vw,160px);height:1px;
    background:linear-gradient(90deg,var(--gold),transparent);
  }
  section.top::before{display:none}

  h1,h2{margin:0;font-family:var(--title);font-weight:400;line-height:1.5;text-wrap:balance}
  h1{
    font-size:clamp(1.7rem,1rem + 3.4vw,3.3rem);color:var(--cream);letter-spacing:-.01em;
    text-shadow:3px 3px 0 rgba(0,0,0,.7), 0 0 42px rgba(232,181,75,.18);
  }
  h2{font-size:clamp(.85rem,.66rem + .8vw,1.2rem);color:var(--cream)}
  p{margin:0;max-width:64ch}
  .sub{color:var(--grey)}

  .eyebrow{
    font-family:var(--ui);font-weight:700;font-size:.68rem;letter-spacing:.26em;
    text-transform:uppercase;color:var(--gold);margin:0 0 1.1rem;display:flex;align-items:center;gap:.6rem;
  }
  .eyebrow::before{content:"";width:1.7rem;height:1px;background:var(--gold);flex:none;opacity:.75}
  .stack{display:flex;flex-direction:column;gap:1.1rem;align-items:flex-start}

  /* ---------- reveal on scroll ---------- */
  .reveal{opacity:0;transform:translateY(22px);
    transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:var(--d,0ms)}
  .reveal.in{opacity:1;transform:none}

  /* ---------- hero ---------- */
  .hero-lead{margin-top:1rem;max-width:54ch;font-size:1.12em}
  .hero-lead b{color:var(--gold);font-weight:400}

  /* ---------- input ---------- */
  .form{display:flex;flex-wrap:wrap;gap:.7rem;margin:1.8rem 0 .7rem;width:100%}
  .form input{
    font-family:var(--ui);font-size:.86rem;background:rgba(10,14,24,.85);color:var(--cream);
    border:1px solid var(--line2);padding:.95rem .9rem;flex:1 1 22rem;min-width:0;
    transition:border-color .28s var(--ease),box-shadow .28s var(--ease),background .28s var(--ease);
  }
  .form input::placeholder{color:var(--grey2)}
  .form input:focus{
    outline:none;border-color:var(--gold);background:rgba(12,17,28,.95);
    box-shadow:0 0 0 1px rgba(232,181,75,.35),0 0 34px -6px rgba(232,181,75,.35);
  }
  .form button{
    position:relative;overflow:hidden;font-family:var(--ui);font-weight:700;font-size:.8rem;
    letter-spacing:.15em;text-transform:uppercase;color:#0A0803;cursor:pointer;
    background:linear-gradient(180deg,#F3C763,var(--gold) 52%,#C2903A);
    border:1px solid rgba(255,232,170,.5);
    padding:.95rem 1.5rem;
    box-shadow:0 8px 0 -4px rgba(0,0,0,.55),0 16px 34px -16px rgba(232,181,75,.75);
    transition:transform .18s var(--ease),box-shadow .18s var(--ease),filter .18s var(--ease);
  }
  .form button::after{
    content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-18deg);animation:sheen 5.5s var(--ease) infinite;
  }
  @keyframes sheen{0%,72%{left:-60%}92%,100%{left:130%}}
  .form button:hover{transform:translateY(-2px);filter:brightness(1.06);
    box-shadow:0 10px 0 -4px rgba(0,0,0,.55),0 22px 42px -16px rgba(232,181,75,.9)}
  .form button:active{transform:translateY(2px);box-shadow:0 4px 0 -3px rgba(0,0,0,.55)}
  .form button:disabled{background:var(--panel2);color:var(--grey);cursor:wait;
    border-color:var(--line2);box-shadow:none;transform:none}
  .form button:disabled::after{display:none}

  .hint{font-family:var(--ui);font-size:.68rem;color:var(--grey2);letter-spacing:.09em;
    line-height:2;max-width:78ch}

  .note{font-family:var(--ui);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;
    padding:.5rem .8rem;display:inline-block;margin-bottom:1rem;border:1px solid var(--line2);
    color:var(--grey);background:var(--panel)}
  .note.demo{border-color:var(--gold2);color:var(--gold);background:rgba(232,181,75,.07)}
  .note.err{border-color:var(--red);color:var(--red);background:rgba(228,69,59,.08)}

  /* ---------- report ---------- */
  .report{
    --notch:14px;width:100%;margin-top:1.3rem;padding:1.5rem 1.35rem;
    background:linear-gradient(170deg,rgba(21,28,45,.95),rgba(15,21,35,.95));
    border:1px solid var(--line2);
    box-shadow:0 30px 70px -40px rgba(0,0,0,.95),0 0 0 1px rgba(242,231,201,.03) inset;
    clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),
      calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px);
    animation:cardIn .6s var(--ease) both;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.995)}to{opacity:1;transform:none}}

  .rhead{display:grid;grid-template-columns:auto 1fr;gap:1.5rem;align-items:center}
  .rhead canvas{width:102px;height:auto;filter:drop-shadow(0 14px 26px rgba(0,0,0,.75))}
  .verdict{font-family:var(--title);font-size:clamp(1rem,.78rem + .95vw,1.55rem);line-height:1.45;
    letter-spacing:.01em;animation:vin .55s var(--ease) both .1s}
  @keyframes vin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
  .vsub{font-family:var(--ui);font-size:.8rem;color:var(--grey);margin-top:.75rem;line-height:1.95;max-width:50ch}
  .g-mint{color:var(--green);text-shadow:0 0 26px rgba(95,201,106,.4)}
  .g-scuffed{color:var(--cream)}
  .g-dented{color:var(--gold);text-shadow:0 0 26px rgba(232,181,75,.35)}
  .g-crushed{color:var(--red);text-shadow:0 0 26px rgba(228,69,59,.35)}
  .g-flattened{color:var(--red);text-shadow:0 0 30px rgba(228,69,59,.5)}
  .g-expired{color:var(--dead)}

  /* dent meter */
  .meter{margin-top:.9rem;height:8px;background:rgba(0,0,0,.45);border:1px solid var(--line2);
    position:relative;overflow:hidden;max-width:26rem}
  .meter i{position:absolute;inset:0 100% 0 0;background:linear-gradient(90deg,var(--green),var(--gold) 55%,var(--red));
    transition:inset 1.1s var(--ease)}
  .meter::after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,transparent 0 5px,rgba(0,0,0,.5) 5px 6px)}

  /* chart */
  .chartwrap{--notch:10px;margin-top:1.4rem;border:1px solid var(--line2);
    background:linear-gradient(180deg,rgba(6,9,16,.94),rgba(10,14,24,.94));
    padding:.75rem .75rem .6rem;position:relative}

  .chead{display:flex;flex-wrap:wrap;align-items:baseline;gap:.7rem;margin-bottom:.65rem}
  .cnow{display:flex;flex-wrap:wrap;align-items:baseline;gap:.6rem;margin-right:auto}
  .cnow .px{font-family:var(--ui);font-size:1.02rem;font-weight:700;color:var(--cream);letter-spacing:.02em}
  .cnow .chg{font-family:var(--ui);font-size:.66rem;letter-spacing:.1em}
  .cnow .chg.up{color:var(--green)} .cnow .chg.dn{color:var(--red)}
  .cnow .cstamp{font-family:var(--ui);font-size:.58rem;letter-spacing:.14em;color:var(--grey2)}
  .cnow .cstamp::before{content:"\25CF";color:var(--green);margin-right:.35rem;font-size:.5rem;
    animation:blip 1.9s var(--ease) infinite}
  .cmode{display:flex;gap:.25rem}
  .mb{font-family:var(--ui);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;
    background:rgba(10,14,24,.75);color:var(--grey);border:1px solid var(--line2);
    padding:.34rem .55rem;cursor:pointer;transition:color .2s var(--ease),border-color .2s var(--ease)}
  .mb:hover:not(:disabled){color:var(--cream);border-color:var(--gold)}
  .mb.on{color:var(--gold);border-color:var(--gold2);background:rgba(232,181,75,.1)}
  .mb:disabled{opacity:.4;cursor:not-allowed}

  .plot{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 4.6rem;gap:0;
    touch-action:pan-y;cursor:crosshair;user-select:none}
  .chart{display:block;width:100%;min-width:0;height:auto;image-rendering:pixelated;
    transition:opacity .2s var(--ease)}
  .chartwrap.loading .chart{opacity:.35}

  .yaxis{position:relative;border-left:1px solid var(--line);background:rgba(4,6,11,.5)}
  .yaxis span{position:absolute;right:.35rem;transform:translateY(-50%);white-space:nowrap;
    font-family:var(--ui);font-size:.55rem;letter-spacing:.04em;color:var(--grey2)}

  .plot .xh,.plot .yh{position:absolute;display:none;pointer-events:none;background:rgba(232,181,75,.34)}
  .plot .xh{top:0;bottom:0;width:1px}
  .plot .yh{left:0;right:4.6rem;height:1px}
  .plot .bub{position:absolute;display:none;pointer-events:none;right:0;width:4.6rem;
    transform:translateY(-50%);background:var(--gold);color:#0A0803;
    font-family:var(--ui);font-size:.55rem;font-style:normal;text-align:center;padding:.14rem 0}

  .tip{position:absolute;display:none;pointer-events:none;z-index:3;max-width:13rem;
    background:rgba(8,11,19,.97);border:1px solid var(--line2);padding:.5rem .6rem;
    font-family:var(--ui);font-size:.57rem;line-height:1.85;letter-spacing:.04em;color:var(--grey);
    box-shadow:0 18px 34px -20px rgba(0,0,0,.95)}
  .tip b{display:block;color:var(--cream);font-size:.55rem;margin-bottom:.25rem;letter-spacing:.1em}
  .tip span{display:block}
  .tip .up{color:var(--green)} .tip .dn{color:var(--red)}

  .meas{position:absolute;display:none;pointer-events:none;z-index:2;
    border:1px dashed rgba(232,181,75,.75);background:rgba(232,181,75,.09)}
  .meas.up{border-color:rgba(95,201,106,.8);background:rgba(95,201,106,.1)}
  .meas.dn{border-color:rgba(228,69,59,.8);background:rgba(228,69,59,.1)}
  .meas::after{content:attr(data-l);position:absolute;left:50%;top:-1.5rem;transform:translateX(-50%);
    white-space:nowrap;font-family:var(--ui);font-size:.57rem;letter-spacing:.08em;
    background:rgba(8,11,19,.97);border:1px solid var(--line2);padding:.24rem .45rem;color:var(--cream)}
  .meas.up::after{color:var(--green)} .meas.dn::after{color:var(--red)}

  .eline{position:absolute;display:none;left:0;right:4.6rem;height:1px;pointer-events:none;z-index:2;
    background:repeating-linear-gradient(90deg,var(--gold) 0 3px,transparent 3px 6px)}
  .eline::after{content:attr(data-l);position:absolute;left:0;top:-1.35rem;white-space:nowrap;
    font-family:var(--ui);font-size:.55rem;letter-spacing:.09em;color:#0A0803;
    background:var(--gold);padding:.16rem .4rem}

  .ctools{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;margin-top:.6rem}
  .cbtn{font-family:var(--ui);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;
    background:rgba(10,14,24,.75);color:var(--grey);border:1px solid var(--line2);
    padding:.32rem .55rem;cursor:pointer;transition:color .2s var(--ease),border-color .2s var(--ease)}
  .cbtn:hover{color:var(--cream);border-color:var(--gold)}
  .cbtn.armed{color:#0A0803;background:var(--gold);border-color:var(--gold)}
  .chelp{font-family:var(--ui);font-size:.55rem;letter-spacing:.11em;text-transform:uppercase;color:var(--grey2)}

  .tfs{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.6rem;position:relative;z-index:1}
  .tfb{font-family:var(--ui);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
    background:rgba(10,14,24,.75);color:var(--grey);border:1px solid var(--line2);
    padding:.36rem .58rem;cursor:pointer;
    transition:color .2s var(--ease),border-color .2s var(--ease),background .2s var(--ease),transform .2s var(--ease)}
  .tfb:hover{color:var(--cream);border-color:var(--gold);transform:translateY(-1px)}
  .tfb.on{color:#0A0803;background:linear-gradient(180deg,#F3C763,var(--gold) 55%,#C2903A);
    border-color:rgba(255,232,170,.5);box-shadow:0 6px 16px -10px rgba(232,181,75,.95)}
  .tfb.on:hover{transform:none}

  .chartcap{font-family:var(--ui);font-size:.58rem;letter-spacing:.13em;text-transform:uppercase;
    color:var(--grey2);margin-top:.55rem;line-height:1.85}

  @media (max-width:620px){
    .plot{grid-template-columns:minmax(0,1fr) 3.7rem}
    .plot .yh,.eline{right:3.7rem}
    .plot .bub{width:3.7rem}
    .yaxis span{font-size:.5rem}
    .chelp{display:none}
  }

  /* links */
  .links{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.2rem}
  .lnk{
    font-family:var(--ui);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;
    text-decoration:none;padding:.5rem .75rem;border:1px solid var(--line2);
    background:rgba(21,28,45,.7);color:var(--grey);
    transition:transform .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease);
  }
  .lnk.own{color:var(--gold);border-color:var(--gold2)}
  .lnk:hover{transform:translateY(-2px);color:var(--cream);border-color:var(--gold);
    box-shadow:0 10px 22px -12px rgba(232,181,75,.8)}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.6rem,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line2);margin-top:1.4rem}
  .stats div{background:linear-gradient(180deg,rgba(21,28,45,.9),rgba(15,21,35,.9));
    padding:.85rem .85rem;font-family:var(--ui);position:relative;min-width:0;overflow:hidden;
    opacity:0;transform:translateY(8px);
    animation:tileIn .5s var(--ease) forwards;animation-delay:calc(var(--i,0)*26ms + 120ms)}
  @keyframes tileIn{to{opacity:1;transform:none}}
  .stats div::after{content:"";position:absolute;left:0;top:0;width:100%;height:1px;
    background:linear-gradient(90deg,rgba(232,181,75,.22),transparent 60%)}
  .stats span{display:block;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--grey2);margin-bottom:.42rem}
  .stats b{display:block;font-size:.92rem;color:var(--cream);font-weight:700;letter-spacing:.02em;
    min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stats b.good{color:var(--green)}
  .stats b.bads{color:var(--red)}

  /* flags */
  .flags{list-style:none;margin:1.5rem 0 0;padding:0;display:flex;flex-direction:column;gap:.55rem}
  .flags li{font-family:var(--ui);font-size:.78rem;line-height:1.85;padding-left:1.75rem;position:relative;
    opacity:0;transform:translateX(-6px);
    animation:flagIn .45s var(--ease) forwards;animation-delay:calc(var(--i,0)*22ms + 260ms)}
  @keyframes flagIn{to{opacity:1;transform:none}}
  .flags li::before{position:absolute;left:0;top:0}
